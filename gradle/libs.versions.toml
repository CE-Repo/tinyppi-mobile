[versions]
# AGP 9.4 still calls a configuration API that Gradle 9.8 deprecates, so the
# wrapper stays on 9.7.1 until it does not: a newer Gradle would only put a
# deprecation warning back into every build.
agp = "9.5.0"
# Held at 2.4.10: 2.4.21 compiles suspend calls into instructions JaCoCo 0.8.15
# cannot see run, which drops the coverage gate below full for no line of ours.
kotlin = "2.4.10"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
# The in-app browser (Custom Tabs) a person's TMDb page opens in.
browser = "1.10.0"
composeBom = "2026.09.00"
# Material 3 is pinned past the BOM on purpose. The expressive style - the
# expressive theme itself, its motion scheme, the button group, the toggle
# button, the loading indicator and the shape library - is internal in the
# stable release and public only here. It brings the Compose runtime it was
# built against with it, which is why the rest of Compose resolves higher
# than the BOM pins it.
material3 = "1.5.0-beta02"
datastore = "1.3.0"
okhttp = "5.5.1"
retrofit = "3.0.0"
retrofitSerialization = "1.0.0"
serialization = "1.11.0"
coil = "3.6.3"
haze = "2.0.1"
junit = "4.13.2"
# Only for the tests, which need its virtual clock. Held to the coroutines the
# lifecycle libraries already bring, so tests run on the library the app ships.
coroutines = "1.10.2"
# The tests that need Android itself (views, Compose, DataStore) run on the JVM
# under Robolectric rather than on a device, so coverage counts every screen.
robolectric = "4.17"
androidxTestCore = "1.7.0"
# Held to the analyser that filters what the Compose and serialization compiler
# plugins generate; older ones count branches nobody wrote.
jacoco = "0.8.15"
# Not a library: the line and branch coverage, in percent, below which the
# build fails. Kept here so the README badge reads the same number the gate does.
coverage = "100"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-sse = { group = "com.squareup.okhttp3", name = "okhttp-sse", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-blur = { group = "dev.chrisbanes.haze", name = "haze-blur", version.ref = "haze" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
