name: Verify pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"
      - name: Unit tests and coverage gate
        run: ./gradlew testDebugUnitTest jacocoDebugUnitTestCoverageVerification --stacktrace
      - name: Lint
        run: ./gradlew lintRelease --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
