name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, coverage and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"
      - name: Unit tests and coverage gate
        run: ./gradlew testDebugUnitTest jacocoDebugUnitTestCoverageVerification --stacktrace
      - name: Lint
        run: ./gradlew lintRelease --stacktrace
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tinyppi-mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
