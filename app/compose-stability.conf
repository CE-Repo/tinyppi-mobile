// Types the Compose compiler is told to treat as stable.
//
// Everything listed is immutable or exposes its changes through observable
// state, so comparing it by equality (or, for the view models, by identity)
// is exactly right. Left to itself the compiler counts any type holding a
// List as unstable, and every lambda that captures one is rebuilt on each
// recomposition.

// Read-only lists, as every model in this app uses them.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map

// What the box sends, and what the app remembers: immutable data classes.
com.jamal2367.tinyppimobile.data.model.*
com.jamal2367.tinyppimobile.data.prefs.*
com.jamal2367.tinyppimobile.data.repository.LiveState

// The screens' state, immutable data classes too.
com.jamal2367.tinyppimobile.ui.live.LiveUiState
com.jamal2367.tinyppimobile.ui.live.LibraryUiState
com.jamal2367.tinyppimobile.ui.live.SeriesUiState
com.jamal2367.tinyppimobile.ui.live.ContinueUiState
com.jamal2367.tinyppimobile.ui.live.OpenShow
com.jamal2367.tinyppimobile.ui.history.HistoryUiState
com.jamal2367.tinyppimobile.ui.settings.SettingsUiState
com.jamal2367.tinyppimobile.ui.settings.TestState

// The view models: one instance per screen for as long as it lives, and
// every change they carry arrives through a StateFlow.
com.jamal2367.tinyppimobile.ui.live.LiveViewModel
com.jamal2367.tinyppimobile.ui.history.HistoryViewModel
com.jamal2367.tinyppimobile.ui.settings.SettingsViewModel
com.jamal2367.tinyppimobile.di.AppContainer
